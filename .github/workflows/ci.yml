name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones + pruebas RLS/ingesta en Postgres local
        run: PGBIN=/usr/lib/postgresql/16/bin bash scripts/test-db.sh
  edge-functions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.5.6 }
      - name: Prueba de integración device-api contra Postgres local
        run: PGBIN=/usr/lib/postgresql/16/bin bash scripts/test-edge.sh
